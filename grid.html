<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Grid Layout</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f4f4;
    padding:20px;
}

.container{
    display:grid;
    grid-template-columns: 1fr 1.5fr 1.5fr;
    grid-template-rows: 80px 180px 180px 100px;
    gap:20px;
    height:100vh;
}

.box{
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:28px;
    font-weight:bold;
    border-radius:5px;
    border:5px solid #222;
    box-shadow:0 4px 8px rgba(0,0,0,0.3);
}

.header{
    grid-column:1 / 4;
    background:linear-gradient(to right,#6d4dd6,#8b74dd);
}

.sidebar{
    grid-row:2 / 4;
    background:linear-gradient(to bottom,#62d0d0,#52a8a8);
}

.content1{
    grid-column:2 / 4;
    background:linear-gradient(to right,#5b4fd8,#42a5f5);
}

.content2{
    background:linear-gradient(to right,#5b4fd8,#42a5f5);
}

.content3{
    background:linear-gradient(to right,#5b4fd8,#42a5f5);
}

.footer{
    grid-column:1 / 4;
    background:linear-gradient(to right,#6d4dd6,#8b74dd);
}
</style>
</head>
<body>

<div class="container">
    <div class="box header">Header</div>

    <div class="box sidebar">Sidebar</div>

    <div class="box content1">Content-1</div>
    <div class="box content2">Content-2</div>
    <div class="box content3">Content-3</div>

    <div class="box footer">Footer</div>
</div>

</body>
</html>
